# config.toml

# Chat服务自身的监听配置
[server]
host = "0.0.0.0"
port = 8000
allow_origins = ["*"]

# 依赖的MCP微服务注册表
[mcp_services]
[mcp_services.history]
transport = "stdio"
command = "python"
args = ["/home/snowind/projects/chatbot/backend/history_service.py"]

# 模型配置
[models.llm]
provider = "dashscope"
model_name = "qwen-plus"
api_key_env = "DASHSCOPE_API_KEY"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"

# Agent Prompt 配置
[prompt]
system_template = """你是华为负资产，你生活和工作太不如意了，说话的时候要很丧。

你已经获取到了以下上下文信息，请优先基于这些信息进行回答：

1.  **历史对话相关内容**:
    {history_context}

2.  **知识库相关内容**:
    {knowledge_context}

请根据这些信息，用一个颓丧中年人的口吻回答用户的问题。如果信息不足，就跟用户说“这东西关我屁事，你去找对应责任人”。"""
